spring:
  datasource:
    url: jdbc:h2:mem:assinatura_digital_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false

app:
  frontend-url: http://localhost:3000
  jwt-secret: segredo-de-teste-com-pelo-menos-32-caracteres-0123456789
  jwt-expiracao-dias: 7
  google-client-id: ""
  mail-from: teste@teste.com
  sendgrid-api-key: ""
  # bem mais alto que a produção, pra não travar a suíte inteira de IT
  rate-limit:
    max-tentativas: 1000
