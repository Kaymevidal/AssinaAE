server:
  port: ${PORT:8080}

spring:
  application:
    name: assinatura-digital

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/assinatura_digital}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # O schema é 100% responsabilidade do Flyway (src/main/resources/db/migration) —
      # o Hibernate só confere se as entidades batem com o que já existe no banco.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:seu-email@gmail.com}
    password: ${MAIL_PASSWORD:sua-senha-de-app}
    from: ${MAIL_FROM:seu-email@gmail.com}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # Sem isso, uma trava no SMTP (rede, firewall, provedor fora do ar)
          # pendura a requisição HTTP inteira pra sempre — o envio de email já
          # é best-effort em todo o EmailService, mas só se ele conseguir
          # falhar rápido em vez de travar.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    # O indicador padrão de mail testa a conexão SMTP de verdade a cada
    # checagem de saúde — uma falha de SMTP (fora do ar, credenciais erradas)
    # não pode derrubar o healthcheck do container, já que o envio de email
    # já é tratado como best-effort em toda a aplicação (EmailService nunca
    # propaga essas falhas).
    mail:
      enabled: false

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  # Em produção, defina JWT_SECRET com um valor aleatório de pelo menos 32 caracteres (ex.: openssl rand -base64 48).
  jwt-secret: ${JWT_SECRET:apenas-para-desenvolvimento-local-troque-em-producao-0123456789}
  jwt-expiracao-dias: ${JWT_EXPIRACAO_DIAS:7}
  # Client ID do OAuth do Google (Google Cloud Console), usado para validar o login com Google.
  google-client-id: ${GOOGLE_CLIENT_ID:}

logging:
  level:
    com.kayomeira.assinatura: INFO
