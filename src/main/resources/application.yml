server:
  port: 8080

spring:
  application:
    name: assinatura-digital

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/assinatura_digital}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # O schema é 100% responsabilidade do Flyway (src/main/resources/db/migration) —
      # o Hibernate só confere se as entidades batem com o que já existe no banco.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:seu-email@gmail.com}
    password: ${MAIL_PASSWORD:sua-senha-de-app}
    from: ${MAIL_FROM:seu-email@gmail.com}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  # Em produção, defina JWT_SECRET com um valor aleatório de pelo menos 32 caracteres (ex.: openssl rand -base64 48).
  jwt-secret: ${JWT_SECRET:apenas-para-desenvolvimento-local-troque-em-producao-0123456789}
  jwt-expiracao-dias: ${JWT_EXPIRACAO_DIAS:7}
  # Client ID do OAuth do Google (Google Cloud Console), usado para validar o login com Google.
  google-client-id: ${GOOGLE_CLIENT_ID:}

logging:
  level:
    com.kayomeira.assinatura: INFO
