server:
  port: 8080

spring:
  application:
    name: assinatura-digital

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/assinatura_digital}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:seu-email@gmail.com}
    password: ${MAIL_PASSWORD:sua-senha-de-app}
    from: ${MAIL_FROM:seu-email@gmail.com}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

logging:
  level:
    com.kayomeira.assinatura: INFO
